version: "3"

tasks:
  run-benchmark-template:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - "{{.BENCHMARK}} {{.BENCHMARK_ARGS}} --benchmark_format=json > reports/{{.REPORT_JSON}}"

    generates:
      - "reports/{{.REPORT_JSON}}"

    vars:
      REPORT_JSON: '{{.REPORT_NAME | default .BENCHMARK_NAME}}.json'
      BENCHMARK: 'build/benchmark/benchmarks/{{.BENCHMARK_DIR}}/{{.BUILD_TYPE | default "Release"}}/ecs-benchmark-{{.BENCHMARK_NAME}}'

  gen-report-template:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - >
        pipx run
        --python 3.11
        --fetch-python missing
        --spec "{{.ROOT_DIR}}/scripts/gen-benchmark-report"
        gen-benchmark-report
        -c "{{.ROOT_DIR}}/plot.config.json"
        --reports-dir="{{.ROOT_DIR}}/reports/"
        gen-plots
        {{.REPORT_FILES}}

      - >
        pipx run
        --python 3.11
        --fetch-python=missing
        --spec "{{.ROOT_DIR}}/scripts/gen-benchmark-report"
        gen-benchmark-report
        -c "{{.ROOT_DIR}}/plot.config.json"
        --reports-dir="{{.ROOT_DIR}}/reports/"
        gen-results-md
        -o {{.OUTPUT}}
        {{.REPORT_FILES}}

    vars:
      REPORT_FILES: "{{range $i, $file := .REPORTS | splitLines -}} {{if $file}} {{$file}} {{end}} {{end}}"
      OUTPUT: '{{.OUTPUT | default "RESULTS.md"}}'

  gen-readme-template:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - >
        pipx run
        --python 3.11
        --fetch-python missing
        --spec ./scripts/gen-benchmark-report
        gen-benchmark-report
        -c "{{.ROOT_DIR}}/plot.config.json"
        --reports-dir="{{.ROOT_DIR}}/reports/"
        gen-readme-md
        -o {{.OUTPUT}}
        -i {{.INPUT}}
        {{.RESULT_FILES}}

    vars:
      RESULT_FILES: "{{range $i, $file := .RESULTS | splitLines -}} {{if $file}} {{$file}} {{end}} {{end}}"
      OUTPUT: '{{.OUTPUT | default "README.md"}}'
      INPUT: '{{.INPUT | default "README.md.mustache"}}'
